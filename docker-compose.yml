version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wayspire_app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:cached
      - ./public/store:/var/www/html/public/store
    environment:
      - APP_ENV=production
      - COMPOSER_ALLOW_SUPERUSER=1
    depends_on:
      - db
    command: ["sh", "-c", "chown -R www-data:www-data /var/www/html/public/store /var/www/html/storage /var/www/html/bootstrap/cache || true && php-fpm"]
  web:
    image: nginx:stable-alpine
    container_name: wayspire_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"       # bind to localhost only, Apache will proxy to this
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: wayspire_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secretroot        # change in production
      MYSQL_DATABASE: wayspire
      MYSQL_USER: wayspire
      MYSQL_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
